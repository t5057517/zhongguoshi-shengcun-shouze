<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国式生存守则 · PC 版</title>
<style>
  :root{
    --bg:#2b2620;
    --panel:#1e1a16;
    --panel-2:#28221c;
    --ink:#f0e9de;
    --muted:#a99e90;
    --accent:#e05a47;
    --accent-soft:#5a3a30;
    --line:#3a322a;
    --green:#8ab87a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    display:flex;
    width:100%;height:100%;
  }
  /* 左侧栏：关卡列表 + 标题 */
  #sidebar{
    width:200px;min-width:200px;height:100%;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  #sidebar .brand{
    padding:20px 18px 12px;
    font-size:16px;font-weight:700;letter-spacing:1px;
    border-bottom:1px solid var(--line);
  }
  #sidebar .brand small{
    display:block;font-size:11px;font-weight:400;color:var(--muted);
    margin-top:4px;letter-spacing:0;
  }
  #level-list{
    flex:1;overflow-y:auto;padding:10px 8px;
  }
  .lv-item{
    padding:10px 12px;margin-bottom:4px;border-radius:8px;
    font-size:13px;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;gap:8px;
    border:1px solid transparent;
    transition:background .15s,color .15s;
  }
  .lv-item:hover{background:var(--panel-2);color:var(--ink);}
  .lv-item.active{background:var(--accent-soft);color:#fff;border-color:var(--accent);}
  .lv-item .num{
    width:20px;height:20px;border-radius:50%;
    background:rgba(255,255,255,.08);font-size:11px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .lv-item.active .num{background:var(--accent);}
  #sidebar .foot{
    padding:12px 18px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.6;
  }
  /* 主舞台 */
  #main{
    flex:1;height:100%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:radial-gradient(ellipse at center, #35302a 0%, #2b2620 70%);
  }
  /* 手机竖屏画布（复用 H5 关卡） */
  #phone-frame{
    position:relative;
    width:375px;height:600px;
    transform-origin:center center;
    background:#f4efe7;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 2px #4a423a;
    overflow:hidden;
  }
  #stage{
    position:absolute;left:0;top:0;width:375px;height:600px;
    background:#f4efe7;overflow:hidden;
  }
  #core{
    position:absolute;left:0;top:0;width:375px;height:600px;overflow:hidden;
  }
  #fade{
    position:absolute;left:0;top:0;width:375px;height:600px;
    background:#111;opacity:0;pointer-events:none;z-index:999;
    display:flex;align-items:center;justify-content:center;
    color:#f5f0e8;font-size:26px;letter-spacing:2px;text-align:center;
    transition:opacity .3s;
  }
  #fade .tt{max-width:320px;line-height:1.5;}
  #fade.show{opacity:1;pointer-events:auto;}
  .hud{
    position:absolute;left:0;top:0;width:375px;height:44px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:13px;color:#7a7268;z-index:10;
  }
  .hud .lv{font-weight:600;color:#5a5248;}
  .bubble{
    position:absolute;background:#fff;border:1.5px solid #d8cfc2;
    border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.4;
    box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:20;white-space:nowrap;
  }
  .bubble::after{
    content:"";position:absolute;width:10px;height:10px;background:#fff;
    border-left:1.5px solid #d8cfc2;border-bottom:1.5px solid #d8cfc2;
    transform:rotate(45deg);bottom:-6px;left:24px;
  }
  button{font-family:inherit;}
  /* 提示 */
  #hint{
    position:absolute;right:24px;bottom:20px;
    font-size:12px;color:var(--muted);letter-spacing:1px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="brand">中国式生存守则<small>PC 客户端 · 桌面版</small></div>
      <div id="level-list"></div>
      <div class="foot">黑色幽默情景游戏<br>看懂场面 → 简单操作 → 现场反应</div>
    </div>
    <div id="main">
      <div id="phone-frame">
        <div id="stage">
          <div id="core"></div>
          <div id="fade"><div class="tt"></div></div>
        </div>
      </div>
      <div id="hint">鼠标操作 · 点击继续</div>
    </div>
  </div>
  <script src="engine.js"></script>
  <script src="levels/level1.js"></script>
  <script src="levels/level2.js"></script>
  <script src="levels/level3.js"></script>
  <script src="levels/level4.js"></script>
</body>
</html>
