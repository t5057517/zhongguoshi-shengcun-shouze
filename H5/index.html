<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>中国式生存守则</title>
<style>
  :root{
    --bg:#f4efe7;
    --ink:#2a2622;
    --card:#ffffff;
    --accent:#c0392b;
    --accent-soft:#e7d7c8;
    --line:#d8cfc2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;
    background:#e9e2d6;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
  }
  #stage{
    position:fixed;
    left:0;top:0;
    transform-origin:top left;
    background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,.25);
    overflow:hidden;
  }
  #core{
    position:absolute;left:0;top:0;
    width:375px;height:600px;
    overflow:hidden;
  }
  /* 转场黑屏 */
  #fade{
    position:absolute;left:0;top:0;width:375px;height:600px;
    background:#111;opacity:0;pointer-events:none;z-index:999;
    display:flex;align-items:center;justify-content:center;
    color:#f5f0e8;font-size:26px;letter-spacing:2px;text-align:center;
    transition:opacity .3s;
  }
  #fade .tt{max-width:320px;line-height:1.5;}
  #fade.show{opacity:1;pointer-events:auto;}
  /* 横屏遮罩：仅对触屏移动设备生效，桌面浏览器不做限制 */
  #landscape{
    position:fixed;left:0;top:0;right:0;bottom:0;background:#17130f;
    display:none;align-items:center;justify-content:center;
    color:#f5f0e8;font-size:20px;letter-spacing:2px;z-index:10000;
  }
  @media (orientation:landscape) and (pointer:coarse){
    #landscape{display:flex;}
  }
  /* 顶部标题栏（每关通用） */
  .hud{
    position:absolute;left:0;top:0;width:375px;height:44px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:13px;color:#7a7268;z-index:10;
  }
  .hud .lv{font-weight:600;color:#5a5248;}
  /* 底部安全区 */
  .safe-pad{padding-bottom:env(safe-area-inset-bottom);}
  /* 气泡 */
  .bubble{
    position:absolute;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.4;
    box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:20;
    white-space:nowrap;
  }
  .bubble::after{
    content:"";position:absolute;width:10px;height:10px;background:#fff;
    border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
    transform:rotate(45deg);bottom:-6px;left:24px;
  }
  button{font-family:inherit;}
</style>
</head>
<body>
  <div id="landscape">请竖屏游玩</div>
  <div id="stage">
    <div id="core"></div>
    <div id="fade"><div class="tt"></div></div>
  </div>
  <script src="main.js"></script>
  <script src="level1.js"></script>
  <script src="level2.js"></script>
  <script src="level3.js"></script>
  <script src="level4.js"></script>
</body>
</html>
